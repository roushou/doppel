syntax = "proto3";

// A machine's film as a viewer draws it over the screen, frame by frame.
// The browser viewer's WebAssembly film answers each frame with one.
package doppel.film.v1;

import "doppel/vmm/v1/vmm.proto";

// What goes over the screen at an instant: the shapes an export burns in,
// and beside each agent's pointer, why it makes its call.
message Frame {
  doppel.vmm.v1.Picture picture = 1;
  repeated Caption captions = 2;
}

// Words beside an agent's pointer, which a viewer adds and a film doesn't.
message Caption {
  // The agent's session: its hue.
  uint64 session = 1;
  // Its client's name, when several agents act.
  optional string client = 2;
  // Why it makes its call, in its words, when it said.
  optional string why = 3;
  // Where its pointer's tip is, in display points.
  doppel.vmm.v1.Spot tip = 4;
}
