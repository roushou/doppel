# Every check a commit must pass: scripts/check.sh, as run locally. Live
# checks need a running VM and aren't run here.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS 27 with Xcode 27 (a preview image). `macos-latest` is macOS 26,
    # which has no Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The VMM uses macOS 27's Virtualization APIs, so it builds only with
      # Xcode 27's SDK.
      - name: Select Xcode 27
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::This runner image has no Xcode 27; Doppel's Swift code needs its SDK."
            exit 1
          fi
          sudo xcode-select --switch "$xcode"
          xcodebuild -version

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2

      - name: Install buf and dprint
        run: brew install buf dprint

      - name: Check
        run: scripts/check.sh
