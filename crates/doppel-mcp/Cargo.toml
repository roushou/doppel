[package]
name = "doppel-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Doppel's MCP server, on rmcp: typed tool calls out to a runner, results back."

[dependencies]
base64.workspace = true
doppel-machine = { path = "../doppel-machine" }
rmcp = { workspace = true, features = ["server"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util = "0.7"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }

[lints]
workspace = true
