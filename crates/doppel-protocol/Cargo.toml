[package]
name = "doppel-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "The Doppel protocol: generated protobuf types, a sans-IO frame codec, the rules of a conversation, and conversions to domain types; and a transport that carries it over a unix socket."

[dependencies]
bytes.workspace = true
doppel-machine = { path = "../doppel-machine" }
doppel-scene = { path = "../doppel-scene" }
prost.workspace = true
thiserror.workspace = true

# The transport's unix sockets; the rest of the crate builds anywhere.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["poll"] }

[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true
