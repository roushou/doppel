version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Envelope oneofs reuse small shared messages (Done, Empty); one request/response
    # type per RPC would add ceremony without safety here.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - WIRE
